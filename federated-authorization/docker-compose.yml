---
# Shared SpiceDB datastore config, passed as environment so the Postgres
# password stays out of the process command line (visible via `docker inspect`)
# and is defined in exactly one place.
x-spicedb-datastore: &spicedb-datastore
  SPICEDB_DATASTORE_ENGINE: "postgres"
  SPICEDB_DATASTORE_CONN_URI: "postgres://spicedb:spicedb@postgres:5432/spicedb?sslmode=disable"

services:
  keycloak:
    image: "quay.io/keycloak/keycloak:24.0"
    command: "start-dev --import-realm"
    environment:
      KEYCLOAK_ADMIN: "admin"
      KEYCLOAK_ADMIN_PASSWORD: "admin"
    volumes:
      - "./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro"
    ports:
      - "8080:8080"
    # The Keycloak 24 image ships no curl/wget, so the healthcheck uses bash's
    # built-in /dev/tcp to issue a raw HTTP request and confirm the realm is
    # actually serving (200 OK), not just that the port is open.
    healthcheck:
      test:
        - "CMD-SHELL"
        - "exec 3<>/dev/tcp/localhost/8080 && printf 'GET /realms/org-a HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"
      interval: "15s"
      timeout: "10s"
      retries: 10
      start_period: "40s"

  # Persistent datastore for SpiceDB. Backing SpiceDB with Postgres (instead of
  # the in-memory engine) is what lets relationships — IdP bindings and document
  # grants alike — survive a restart of the stack.
  postgres:
    image: "postgres:16-alpine"
    # track_commit_timestamp=on is SpiceDB's recommended Postgres setting; it
    # enables the Watch API and silences a startup warning from SpiceDB.
    command: ["postgres", "-c", "track_commit_timestamp=on"]
    environment:
      POSTGRES_USER: "spicedb"
      POSTGRES_PASSWORD: "spicedb"
      POSTGRES_DB: "spicedb"
    volumes:
      - "postgres-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spicedb -d spicedb"]
      interval: "5s"
      timeout: "5s"
      retries: 10
      start_period: "10s"

  # One-shot: create/upgrade SpiceDB's Postgres schema, then exit. 'spicedb
  # serve' waits for this to complete (service_completed_successfully) so it
  # never starts against an unmigrated database.
  spicedb-migrate:
    image: "authzed/spicedb:latest"
    command: "datastore migrate head"
    environment:
      <<: *spicedb-datastore
    depends_on:
      postgres:
        condition: "service_healthy"
    restart: "on-failure"

  spicedb:
    image: "authzed/spicedb:latest"
    command: >
      serve
      --grpc-preshared-key=demo-token-do-not-use-in-prod
      --http-enabled
    environment:
      <<: *spicedb-datastore
    depends_on:
      spicedb-migrate:
        condition: "service_completed_successfully"
    ports:
      - "50051:50051"  # gRPC
      - "8090:8443"    # HTTP API (SpiceDB serves REST on 8443; mapped to 8090 on host to avoid conflict with Keycloak)
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=:50051"]
      interval: "10s"
      timeout: "5s"
      retries: 5
      start_period: "10s"

  app:
    build: "."
    ports:
      - "8000:8000"
    volumes:
      - "app-data:/data"
    environment:
      # SpiceDB
      SPICEDB_ENDPOINT: "spicedb:50051"
      SPICEDB_PRESHARED_KEY: "demo-token-do-not-use-in-prod"
      # Keycloak — two addresses are needed because of Docker networking:
      # KEYCLOAK_ISSUER is the container-network address used for server-to-server
      # calls (token exchange, JWKS fetch, userinfo).  Only the app container can
      # resolve 'keycloak'; the user's browser cannot.
      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/org-a"
      # KEYCLOAK_PUBLIC_ISSUER is the host-facing address used only to build the
      # browser redirect URL for the authorization endpoint.  'localhost:8080' is
      # what the host exposes, not reachable inside the app container by that name.
      KEYCLOAK_PUBLIC_ISSUER: "http://localhost:8080/realms/org-a"
      KEYCLOAK_CLIENT_ID: "federated-authz-demo"
      KEYCLOAK_CLIENT_SECRET: "federated-authz-demo-secret"
      # GitHub — must be supplied via .env or environment
      GITHUB_CLIENT_ID: "${GITHUB_CLIENT_ID:-}"
      GITHUB_CLIENT_SECRET: "${GITHUB_CLIENT_SECRET:-}"
      # App
      SESSION_SECRET: "${SESSION_SECRET:-dev-session-secret-change-in-prod}"
      APP_BASE_URL: "http://localhost:8000"
      DB_PATH: "/data/app.db"
      DOCUMENTS_DIR: "/data/documents"
    depends_on:
      keycloak:
        condition: "service_healthy"
      spicedb:
        condition: "service_healthy"
    restart: "on-failure"

volumes:
  app-data:
  postgres-data:
