{% extends "base.html" %}
{% block title %}New Document{% endblock %}
{% block content %}
<div class="page-header">
    <h2>New Document</h2>
    <a href="/" class="btn btn-outline">&larr; Back</a>
</div>

<form method="post" action="/documents/new" class="doc-form">
    <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" name="title" required class="form-control" placeholder="Document title">
    </div>
    <div class="form-group">
        <label for="content">Content (Markdown)</label>
        <textarea id="content" name="content" rows="16" class="form-control" placeholder="# My Document&#10;&#10;Write your content here..."></textarea>
    </div>
    <div class="form-actions">
        <button type="submit" class="btn btn-primary">Create Document</button>
        <a href="/" class="btn btn-outline">Cancel</a>
    </div>
</form>
<p class="hint">SpiceDB will record <code>document:&lt;id&gt;#owner@user:{{ user.id[:8] }}...</code> on creation.</p>
{% endblock %}
